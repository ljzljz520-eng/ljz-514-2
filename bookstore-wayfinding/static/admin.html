<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>管理后台 · 书山有路</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🛠️ 拓扑管理后台 <small>维护书区节点与通道边</small></div>
  <nav><a href="index.html">读者找书</a><a href="admin.html" class="active">管理员后台</a></nav>
</header>

<div class="toast" id="toast"></div>
<div class="two-col">
  <!-- 节点 -->
  <section class="card">
    <h2 id="nodeFormTitle">新增节点</h2>
    <form id="nodeForm" class="form-grid">
      <label class="wide">节点编码（英文，如 f4_art；新建后不可改）<input name="code" required placeholder="f4_art"></label>
      <label class="wide">名称<input name="name" required placeholder="如 艺术设计区"></label>
      <label>楼层<input name="floor" type="number" value="1" min="1" required></label>
      <label>类型
        <select name="node_type">
          <option value="zone">书区 zone</option>
          <option value="cashier">收银台 cashier</option>
          <option value="entrance">入口 entrance</option>
          <option value="escalator">扶梯 escalator</option>
          <option value="elevator">电梯 elevator</option>
          <option value="junction">通道口 junction</option>
          <option value="hallway">中庭 hallway</option>
          <option value="service">服务台 service</option>
        </select>
      </label>
      <label>X 坐标<input name="x" type="number" value="500" required></label>
      <label>Y 坐标<input name="y" type="number" value="300" required></label>
      <label>拥挤度(1畅通 2一般 3拥挤)
        <select name="crowd_level"><option>1</option><option>2</option><option>3</option></select>
      </label>
      <label style="align-self:end">
        <button type="submit" class="primary">保存节点</button>
      </label>
      <label style="align-self:end">
        <button type="button" id="nodeReset" class="pref">清空表单</button>
      </label>
    </form>
    <h2 style="margin-top:18px">节点列表 <input id="nodeFilter" placeholder="按名称筛选..."
      style="width:160px;float:right;font-size:12px;padding:5px"></h2>
    <div style="max-height:420px;overflow:auto">
    <table id="nodeTable">
      <thead><tr><th>编码</th><th>名称</th><th>层</th><th>类型</th><th>拥挤</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
    </div>
  </section>

  <!-- 边 -->
  <section class="card">
    <h2 id="edgeFormTitle">新增通道边</h2>
    <form id="edgeForm" class="form-grid">
      <label class="wide">通道编码（英文，如 v_elev_34；新建后不可改）<input name="code" required placeholder="v_elev_34"></label>
      <label>起点节点<select name="from_code"></select></label>
      <label>终点节点<select name="to_code"></select></label>
      <label class="wide">通道名称<input name="name" required placeholder="如 东扶梯 3↔4层"></label>
      <label>类型
        <select name="edge_type">
          <option value="walkway">步行通道 walkway</option>
          <option value="escalator">扶梯 escalator</option>
          <option value="elevator">电梯 elevator</option>
        </select>
      </label>
      <label>跨层数(步行填0)<input name="level_change" type="number" value="0" min="0"></label>
      <label>距离(米)/每层耗时折算<input name="distance_m" type="number" step="0.1" value="10" required></label>
      <label>拥挤度
        <select name="crowd_level"><option>1</option><option>2</option><option>3</option></select>
      </label>
      <label class="wide checkline"><input type="checkbox" name="enabled" checked> 启用（停用后该通道不参与寻路）</label>
      <label style="align-self:end"><button type="submit" class="primary">保存通道</button></label>
      <label style="align-self:end"><button type="button" id="edgeReset" class="pref">清空表单</button></label>
    </form>
    <h2 style="margin-top:18px">通道边列表</h2>
    <div style="max-height:420px;overflow:auto">
    <table id="edgeTable">
      <thead><tr><th>编码</th><th>起→终</th><th>类型</th><th>米</th><th>拥挤</th><th>状态</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
    </div>
  </section>
</div>
<script src="admin.js"></script>
</body>
</html>
